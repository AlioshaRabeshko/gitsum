name: Release on PR Approval & Merge

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint, test, build
        run: |
          yarn lint
          yarn test
          yarn build
          chmod +x dist/index.cjs
          cp node_modules/@dqbd/tiktoken/tiktoken_bg.wasm dist/

      - name: Remove dist from .gitignore
        run: |
          cat .gitignore | awk '$0!~"dist"{print}' > .gitignore_tmp
          mv .gitignore_tmp .gitignore

      - name: Bump version and create tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        run: |
          npx gitsums -f origin/${{ github.event.pull_request.base.ref }} -t origin/${{ github.event.pull_request.head.ref }} --custom > changelog.md
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file changelog.md
          npm publish

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
